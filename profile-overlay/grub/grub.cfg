set default=0
set timeout=8
set timeout_style=menu
set color_normal="light-gray/black"
set color_highlight="black/light-magenta"
set menu_color_normal="light-gray/black"
set menu_color_highlight="black/light-magenta"

insmod all_video
terminal_output console

echo '  ____  _   _ ____  __  __  ___  _     ____   ____   _   '
echo ' | __ )| | | |  _ \\|  \\/  |/ _ \\| |   |  _ \\ / ___| / \\  '
echo ' |  _ \\| | | | |_) | |\\/| | | | | |   | | | | |  _ / _ \\ '
echo ' | |_) | |_| |  _ <| |  | | |_| | |___| |_| | |_| / ___ \\ '
echo ' |____/ \\___/|_| \\_\\_|  |_|\\___/|_____|____/ \\____/_/   \\_\\'
echo '                    MEME EDITION'
echo ''

menuentry 'BURMOLDA OS  |  Start Live Desktop' --class arch --class gnu-linux --class os --id burmolda-live {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'BURMOLDA OS  |  Boot to terminal (troubleshooting)' --class arch --class gnu-linux --class os --id burmolda-text {
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry 'UEFI Firmware Settings' --id firmware {
        fwsetup
    }
fi
