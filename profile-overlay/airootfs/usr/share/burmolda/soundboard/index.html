<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burmolda Soundboard</title>
<style>
:root{color-scheme:dark;--bg:#100d18;--panel:#1b1424;--pink:#ff3bd4;--lime:#a4ff45;--muted:#b9a9ce}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#3b1643,transparent 38%),radial-gradient(circle at 90% 80%,#17351d,transparent 35%),var(--bg);font:16px system-ui;color:#fff;padding:32px}.wrap{max-width:1000px;margin:auto}.brand{display:flex;align-items:center;gap:16px}.mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--lime));display:grid;place-items:center;color:#130e19;font-weight:1000;font-size:34px;box-shadow:0 0 30px #ff3bd455}h1{font-size:clamp(28px,5vw,48px);margin:0;letter-spacing:2px}.sub{color:var(--muted);margin:4px 0 26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.sound{border:1px solid #493451;background:linear-gradient(145deg,#24182d,#17131f);border-radius:18px;padding:20px;color:white;text-align:left;cursor:pointer;min-height:130px;transition:.15s}.sound:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 8px 30px #ff3bd422}.sound:active{transform:scale(.98)}.emoji{font-size:28px}.name{display:block;font-size:18px;font-weight:800;margin-top:12px}.desc{display:block;color:var(--muted);font-size:13px;margin-top:4px}.foot{color:#9888a8;font-size:12px;margin-top:26px}
</style></head><body><main class="wrap"><header class="brand"><div class="mark">B</div><div><h1>BURMOLDA SOUNDBOARD</h1><div class="sub">Original meme-style UI sounds · offline</div></div></header><section class="grid">
<button class="sound" data-audio="../sounds/intro.wav"><span class="emoji">🚀</span><span class="name">Main character entry</span><span class="desc">Short synthesized startup sting</span></button>
<button class="sound" data-audio="../sounds/notification.wav"><span class="emoji">🔔</span><span class="name">Notification moment</span><span class="desc">Bright two-tone alert</span></button>
<button class="sound" data-audio="../sounds/error.wav"><span class="emoji">💀</span><span class="name">Skill issue</span><span class="desc">Comical descending error cue</span></button>
<button class="sound" data-audio="../sounds/boing.wav"><span class="emoji">🌀</span><span class="name">Unexpected plot twist</span><span class="desc">Original springy synth effect</span></button>
</section><p class="foot">Fan-made Burmolda OS component. Add only audio you have permission to redistribute.</p></main><script>let current=null;document.querySelectorAll('[data-audio]').forEach(b=>b.addEventListener('click',()=>{if(current){current.pause();current.currentTime=0}current=new Audio(b.dataset.audio);current.play().catch(()=>{})}));</script></body></html>
